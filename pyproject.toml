[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aberoth-ephemeris"
dynamic = ["version"]

description = "Provides predictions for scroll and lunar events in the MMO Aberoth"
authors = [{name = "Jeremiah Vandagrift"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "python-dotenv==1.0.1",
    "Flask==3.0.3",
    "Flask-Cors==4.0.1",
    "waitress==3.0.0",
]

readme = "README.md"
license = {file = "LICENSE.txt"}
keywords = ["aberoth", "solar system", "orbs", "ephemeris"]

[project.urls]
Homepage = "https://github.com/jvandag/aberoth-ephemeris"

[project.optional-dependencies]
dev = ["pytest", "black", "pre_commit", "twine", "wheel", "setuptools"]

[project.scripts]
aberoth_ephemeris = "aberoth_ephemeris.__main__:main"
